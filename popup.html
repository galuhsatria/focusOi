<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>focusoi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <div class="title">
        <h1>FocusOi</h1>
        <p>Lu pakek gue buat jadiin pomodoro biar lu focusOi 👊🏻</p>
      </div>

      <div class="app">
        <ul id="menu">
          <li id="pomodoro" class="menu-item">Pomodoro</li>
          <li id="shortbreak" class="menu-item">Short Break</li>
          <li id="longbreak" class="menu-item">Long Break</li>
        </ul>

        <div class="time">
          <p id="time"></p>
          <button id="start">
            <div class="svg-wrapper-1">
              <div class="svg-wrapper">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-play-icon lucide-play"
                >
                  <polygon points="6 3 20 12 6 21 6 3" />
                </svg>
              </div>
            </div>
            <span>Mulai</span>
          </button>
        </div>

        <div>
          <div class="settings">
            <p>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-settings-icon lucide-settings"
              >
                <path
                  d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span>Settings</span>
            </p>
            <div id="reset-settings" title="Reset Settings">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-rotate-ccw-icon lucide-rotate-ccw"
              >
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
            </div>
          </div>

          <div class="custom-time">
            <p>Time</p>
            <div class="custom-time-form">
              <div class="input-custom-time">
                <label for="pomodoro-input">Pomodoro</label>
                <input type="number" id="pomodoro-input" label-for="pomodoro" min="1" value="25" />
              </div>
              <div class="input-custom-time">
                <label for="shortbreak-input">Short Break</label>
                <input type="number" id="shortbreak-input" label-for="shortbreak" min="1" value="5" />
              </div>
              <div class="input-custom-time">
                <label for="longbreak-input">Long Break</label>
                <input type="number" id="longbreak-input" label-for="longbreak" min="1" value="15" />
              </div>
            </div>
          </div>

          <div class="notifications">
            <p>Notificaions</p>
            <div class="notification-choices" id="notification-container"></div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>Made with 😅 by <a href="https://galuhsatria.vercel.app/" target="_blank">Galuh</a></p>
    </footer>

    <script src="./popup.js"></script>
  </body>
</html>
